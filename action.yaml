name: Sync upstream
description: Rebase this fork's branch onto the same branch of its parent and force-with-lease push it.

inputs:
  branch:
    description: Branch name to sync
    required: false
    default: "default"

runs:
  using: composite
  steps:
    - name: Resolve the fork parent
      id: repo
      shell: bash
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        parent=$(gh api "repos/${GITHUB_REPOSITORY}" --jq '.parent.full_name')
        echo "parent=${parent}" >> "$GITHUB_OUTPUT"

    - name: Fetch the branch
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        PARENT: ${{ steps.repo.outputs.parent }}
        BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail
        git fetch origin "$BRANCH"
        git fetch "https://github.com/${PARENT}.git" "+${BRANCH}:refs/remotes/upstream/${BRANCH}"
        git checkout -B "$BRANCH" "origin/${BRANCH}"

    - name: Rebase onto upstream
      id: rebase
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        BRANCH: ${{ inputs.branch }}
      run: |
        set -euo pipefail
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        lease=$(git rev-parse HEAD)
        echo "lease=${lease}" >> "$GITHUB_OUTPUT"
        if ! git rebase "refs/remotes/upstream/${BRANCH}"; then
          git rebase --abort || true
          echo "::error::Rebase onto upstream/${BRANCH} hit a conflict. ${BRANCH} was not pushed."
          exit 1
        fi

    - name: Push the rebased branch
      shell: bash
      working-directory: ${{ github.workspace }}
      env:
        BRANCH: ${{ inputs.branch }}
        LEASE: ${{ steps.rebase.outputs.lease }}
      run: |
        set -euo pipefail
        if [[ "$(git rev-parse HEAD)" == "$LEASE" ]]; then
          echo "${BRANCH} already starts from upstream."
          exit 0
        fi
        git push --force-with-lease="${BRANCH}:${LEASE}" origin "HEAD:${BRANCH}"
        echo "Pushed ${BRANCH}."
